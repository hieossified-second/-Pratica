<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Manutenção de Usuários</title>
</head>

<body>

    <h3>MANUTENÇÃO DE USUÁRIOS DO SISTEMA INTERNO</h3>

    <form>

        <label>Login</label>
        <input type="text" name="login">
        <br><br>

        <label>Senha</label>
        <input type="password" name="senha">
        <br><br>

        <label>Status</label>
        <select name="status">
            <option>Inativo</option>
            <option>Ativo</option>
        </select>
        <br><br>

        <label>Tipo</label>

        <input type="radio" name="tipo" value="tecnico">
        Técnico

        <input type="radio" name="tipo" value="professor">
        Professor

        <input type="radio" name="tipo" value="aluno">
        Aluno

        <br><br>

        <label>Data Criação</label>
        <input type="date" name="data">
        <br><br>

        <label>Perfil</label>

        <input type="radio" name="perfil" value="convidado">
        Convidado

        <input type="radio" name="perfil" value="administrador">
        Administrador

        <br><br>

        <label>Observações</label>
        <br>
        <textarea name="observacoes" rows="6" cols="40"></textarea>

        <br><br>

        <label>Módulos</label>
        <br>

        <input type="checkbox" name="modulos" value="compras">
        Compras

        <input type="checkbox" name="modulos" value="biblioteca">
        Biblioteca

        <input type="checkbox" name="modulos" value="academico">
        Acadêmico

        <br><br>

        <input type="checkbox" name="modulos" value="documentacao">
        Documentação

        <input type="checkbox" name="modulos" value="recursos_humanos">
        Recursos Humanos

        <br><br><br>

        <input type="submit" value="Cadastrar">
        <input type="button" value="Excluir">

    </form>

</body>

</html>
